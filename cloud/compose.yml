# NewsNook Cloud API。PostgreSQL 使用外部实例（不在本 compose 内起库）。
# Nginx 在另一台机器时：把 API_PUBLISH_HOST 设为 0.0.0.0，
# API_PUBLISH_PORT 设成反代 upstream 端口，并用防火墙只放行 Nginx 机。
#
#   ./deploy up
#   ./deploy db migrate
#   ./deploy health
#
# .env 的 DATABASE_URL 必须指向容器能访问到的地址（不要写 localhost）。

name: newsnook-cloud

services:
  api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    image: newsnook-cloud-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # 反代在另一台机时必须为 true，限流与日志才认 X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-true}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # 宿主机发布地址:容器内 8787（跨机时由 Nginx proxy_pass 到此发布端口）
      # 同机 Nginx 可改为 127.0.0.1:8787:8787
      - '${API_PUBLISH_HOST:-0.0.0.0}:${API_PUBLISH_PORT:-8787}:8787'
