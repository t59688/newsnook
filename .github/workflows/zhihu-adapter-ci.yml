name: Zhihu Adapter CI

on:
  pull_request:
    paths:
      - 'src/features/zhihu/**'
      - 'src/features/comments/**'
      - 'src/lib/http.ts'
      - 'src/lib/types.ts'
      - 'src/lib/parseFeed.ts'
      - 'src/lib/parseFeed/zhihu.ts'
      - 'src/sources/**'
      - 'src/screens/MeScreen.tsx'
      - 'android/app/src/**'
      - 'scripts/zhihu-adapter.test.ts'
      - '.github/workflows/zhihu-adapter-ci.yml'

concurrency:
  group: zhihu-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Adapter tests
        run: npx tsx scripts/zhihu-adapter.test.ts
      - name: TypeScript and web production build
        run: npm run build

  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Sync Capacitor project
        run: npm run android:sync
      - name: Compile cloud debug variant
        working-directory: android
        run: ./gradlew assembleCloudDebug --stacktrace
