name: RSS Subscription Store CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:feed-discovery
      - run: npm run test:prestore
      - run: npm run test:config-backup
      - run: npm run test:sync-projection
      - run: npm run test:cloud-contracts
      - run: npm run lint
      - run: npm run build
