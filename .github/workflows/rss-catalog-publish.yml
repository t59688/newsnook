name: Publish RSS Catalog
run-name: RSS Catalog · ${{ inputs.version || github.run_number }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '包含目录与发布脚本的分支或提交'
        default: beta
        required: true
        type: string
      version:
        description: '目录版本（留空自动生成）'
        required: false
        type: string
      publish:
        description: '发布到 R2（关闭则只构建与校验）'
        default: false
        type: boolean
      configure_cors:
        description: '配置公开只读 CORS（需要桶配置权限，仅首次设置时使用）'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: rss-catalog-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate publication inputs
        run: |
          node --import tsx scripts/rss-catalog.test.ts
          node --import tsx scripts/rss-catalog-import.test.ts
          node --import tsx scripts/rss-catalog-release.test.ts
      - name: Build catalog
        shell: bash
        run: |
          VERSION="${CATALOG_VERSION:-$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"
          [[ "$VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$ ]] || { echo 'Invalid catalog version'; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          node --import tsx scripts/rss-catalog-release.ts --version "$VERSION" --out "$RUNNER_TEMP/rss-catalog"
      - uses: actions/upload-artifact@v4
        with:
          name: rss-catalog-${{ github.run_number }}
          path: ${{ runner.temp }}/rss-catalog/
      - name: Ensure public catalog CORS
        if: inputs.publish && inputs.configure_cors
        env:
          R2_BUCKET: newsnook-update
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        shell: bash
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BEFORE="$RUNNER_TEMP/rss-cors-before.json"
          AFTER="$RUNNER_TEMP/rss-cors-after.json"
          if ! aws s3api get-bucket-cors --bucket "$R2_BUCKET" --endpoint-url "$ENDPOINT" > "$BEFORE" 2> "$RUNNER_TEMP/rss-cors-error.txt"; then
            if grep -q 'NoSuchCORSConfiguration' "$RUNNER_TEMP/rss-cors-error.txt"; then
              echo '{"CORSRules":[]}' > "$BEFORE"
            else
              echo 'Unable to read existing R2 CORS; existing configuration was not changed'
              sed -n 's/.*An error occurred (\([^)]*\)).*/R2 CORS error code: \1/p' "$RUNNER_TEMP/rss-cors-error.txt"
              exit 1
            fi
          fi
          jq '{CORSRules: ((.CORSRules // []) | if any(.[]; (.AllowedOrigins | index("*")) and (.AllowedMethods | index("GET")) and (.AllowedMethods | index("HEAD")) and (.AllowedHeaders // [] | index("*"))) then . else . + [{AllowedOrigins:["*"],AllowedMethods:["GET","HEAD"],AllowedHeaders:["*"],ExposeHeaders:["ETag","Content-Length"],MaxAgeSeconds:3600}] end)}' "$BEFORE" > "$AFTER"
          if ! diff -q <(jq -Sc . "$BEFORE") <(jq -Sc . "$AFTER") > /dev/null; then
            aws s3api put-bucket-cors --bucket "$R2_BUCKET" --endpoint-url "$ENDPOINT" --cors-configuration "file://$AFTER"
          fi
      - name: Publish snapshot then manifest
        if: inputs.publish
        env:
          R2_BUCKET: newsnook-update
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/rss-catalog-release.ts --publish --version "$RELEASE_VERSION" --out "$RUNNER_TEMP/rss-catalog"
