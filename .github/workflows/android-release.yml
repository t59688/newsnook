name: Android Release
run-name: Android ${{ contains(github.ref_name, '-beta.') && 'Beta' || 'Stable' }} Release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  # 所有 Release 串行，避免两个 tag 并发完成顺序相反导致 latest.json 回退。
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ contains(github.ref_name, '-beta.') && 'Beta' || 'Stable' }} · ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NEWSNOOK_KEYSTORE_PASSWORD: ${{ secrets.NEWSNOOK_KEYSTORE_PASSWORD }}
      NEWSNOOK_KEY_ALIAS: ${{ secrets.NEWSNOOK_KEY_ALIAS }}
      NEWSNOOK_KEY_PASSWORD: ${{ secrets.NEWSNOOK_KEY_PASSWORD }}
      VITE_CLOUD_BASE_URL: ${{ vars.VITE_CLOUD_BASE_URL }}

      R2_BUCKET: newsnook-update
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      UPDATE_BASE_URL: https://news-update.aizeek.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve and validate release contract
        id: release_contract
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"

          node scripts/release-contract.mjs "$TAG_VERSION" > "$RUNNER_TEMP/release-contract.json"
          RELEASE_TRACK="$(jq -r '.track' "$RUNNER_TEMP/release-contract.json")"
          RELEASE_BRANCH="$(jq -r '.branch' "$RUNNER_TEMP/release-contract.json")"
          VERSION_CODE="$(jq -r '.versionCode' "$RUNNER_TEMP/release-contract.json")"

          echo "tag=${GITHUB_REF_NAME}"
          echo "package.json=${PKG_VERSION}"
          echo "track=${RELEASE_TRACK}"
          echo "required-branch=${RELEASE_BRANCH}"
          echo "android-version-code=${VERSION_CODE}"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match package.json version ${PKG_VERSION}."
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$PKG_VERSION" ] || [ "$LOCK_ROOT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::package.json/package-lock.json versions must match before release."
            echo "::error::package=${PKG_VERSION} lock=${LOCK_VERSION} lock-root=${LOCK_ROOT_VERSION}"
            exit 1
          fi

          git fetch --no-tags origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          BRANCH_HEAD="$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}")"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$BRANCH_HEAD"; then
            echo "::error::${GITHUB_REF_NAME} is a ${RELEASE_TRACK} release and its tagged commit must belong to ${RELEASE_BRANCH}."
            echo "::error::tag commit=$GITHUB_SHA branch head=$BRANCH_HEAD"
            exit 1
          fi

          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TRACK=$RELEASE_TRACK" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "R2_TRACK_PREFIX=newsnook/$RELEASE_TRACK" >> "$GITHUB_ENV"

          echo "track=$RELEASE_TRACK" >> "$GITHUB_OUTPUT"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1'

      - name: Preflight R2 publishing
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions R2 setting: ${name}"
              exit 1
            fi
          done
          aws --version
          jq --version
          curl --version
          aws s3api list-objects-v2             --bucket "$R2_BUCKET"             --max-keys 1             --endpoint-url "$R2_ENDPOINT"             --output json > /dev/null

      - name: Reject release-channel rollback
        run: |
          set -euo pipefail
          CURRENT_MANIFEST="${RUNNER_TEMP}/current-release.json"
          CURRENT_VERSION=''
          TRACK_KEY="${R2_TRACK_PREFIX}/latest.json"
          ROOT_KEY='newsnook/latest.json'
          OBJECTS="${RUNNER_TEMP}/release-baseline-objects.json"

          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix 'newsnook/' \
            --endpoint-url "$R2_ENDPOINT" \
            --output json > "$OBJECTS"

          if jq -e --arg key "$TRACK_KEY" '[.Contents[]?.Key] | index($key) != null' "$OBJECTS" > /dev/null; then
            aws s3 cp "s3://${R2_BUCKET}/${TRACK_KEY}" "$CURRENT_MANIFEST" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            CURRENT_VERSION="$(jq -r '.version // empty' "$CURRENT_MANIFEST")"
          elif [ "$RELEASE_TRACK" = 'stable' ] && \
            jq -e --arg key "$ROOT_KEY" '[.Contents[]?.Key] | index($key) != null' "$OBJECTS" > /dev/null; then
            # 双通道首次正式发布前，旧 schema v1 根目录清单仍是当前 Stable 基线。
            aws s3 cp "s3://${R2_BUCKET}/${ROOT_KEY}" "$CURRENT_MANIFEST" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            CURRENT_VERSION="$(jq -r '.version // empty' "$CURRENT_MANIFEST")"
          fi

          if [ -n "$CURRENT_VERSION" ]; then
            node --input-type=module - "$VERSION" "$CURRENT_VERSION" <<'NODE'
          import { compareReleaseVersions } from './scripts/release-contract.mjs'
          const candidate = process.argv[2]
          const current = process.argv[3]
          const cmp = compareReleaseVersions(candidate, current)
          if (!Number.isFinite(cmp)) {
            console.error(`::error::Unable to compare candidate ${candidate} with current ${current}.`)
            process.exit(1)
          }
          if (cmp < 0) {
            console.error(`::error::Refusing rollback: candidate ${candidate} is older than current ${current}.`)
            process.exit(1)
          }
          console.log(`release monotonicity ok: current=${current} candidate=${candidate}`)
          NODE
          else
            echo "No current ${RELEASE_TRACK} manifest found; treating this as first publication for the track."
          fi

      - name: Restore release keystore
        env:
          NEWSNOOK_KEYSTORE_BASE64: ${{ secrets.NEWSNOOK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$NEWSNOOK_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NEWSNOOK_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          for name in NEWSNOOK_KEYSTORE_PASSWORD NEWSNOOK_KEY_ALIAS NEWSNOOK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/newsnook-release.jks"
          printf '%s' "$NEWSNOOK_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "NEWSNOOK_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Verify release/update contract
        run: npm run test:app-update

      - name: Verify LinuxDO reading session and UI contracts
        run: npm run test:linuxdo

      - name: Verify Chrome 69 runtime compatibility
        run: npm run test:webview-runtime-compat

      - name: Verify Zhihu content/video DOM contract
        run: npm run test:zhihu-content && npm run test:react-innerhtml-stability

      - name: Verify Android hardware back contract
        run: npm run test:hardware-back

      - name: Verify UI control text-selection contract
        run: npm run test:control-text-selection && npx tsx scripts/context-actions.test.ts

      - name: Initialize Bergamot native engine
        run: npm run bergamot:init

      - name: Build signed APKs
        run: npm run android:apk

      - name: Build signed AABs
        run: npm run android:aab

      - name: Verify Android version metadata
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found at ${AAPT2}."
            exit 1
          fi

          shopt -s nullglob
          APKS=(
            "artifacts/android/newsnook-${VERSION}-cloud-release.apk"
            "artifacts/android/newsnook-${VERSION}-local-release.apk"
            artifacts/android/newsnook-"${VERSION}"-local-*-release.apk
          )
          if [ "${#APKS[@]}" -ne 6 ]; then
            echo "::error::Expected cloud + local universal + 4 local ABI APKs, got ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            BADGING="$("$AAPT2" dump badging "$APK" | head -n 1)"
            APK_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
            APK_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
            if [ "$APK_VERSION_NAME" != "$VERSION" ]; then
              echo "::error::$APK versionName ${APK_VERSION_NAME} does not match ${VERSION}."
              exit 1
            fi
            if [ "$APK_VERSION_CODE" != "$VERSION_CODE" ]; then
              echo "::error::$APK versionCode ${APK_VERSION_CODE} does not match ${VERSION_CODE}."
              exit 1
            fi
          done

          declare -A EXPECTED=(
            [arm64-v8a]='lib/arm64-v8a/'
            [armeabi-v7a]='lib/armeabi-v7a/'
            [x86]='lib/x86/'
            [x86_64]='lib/x86_64/'
          )
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="artifacts/android/newsnook-${VERSION}-local-${abi}-release.apk"
            entries="$(unzip -Z1 "$apk" | grep '^lib/' || true)"
            if [ -z "$entries" ] || printf '%s\n' "$entries" | grep -Ev "^${EXPECTED[$abi]}" > /dev/null; then
              echo "::error::$apk contains missing or foreign ABI native libraries."
              printf '%s\n' "$entries"
              exit 1
            fi
          done
          unzip -Z1 "artifacts/android/newsnook-${VERSION}-local-arm64-v8a-release.apk" \
            | grep -q '^lib/arm64-v8a/libbergamot_jni.so$'

      - name: Verify Android patch application
        run: |
          cd android
          ./gradlew :app:testCloudDebugUnitTest \
            --tests com.aizeek.newsnook.AppUpdateDeltaTest \
            --no-daemon --console=plain

      - name: List artifacts
        run: ls -lh artifacts/android/

      - name: Generate and verify signed-APK deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/newsnook-r2"
          node scripts/android-delta-release.mjs "$VERSION" "$RELEASE_TRACK" "${RUNNER_TEMP}/newsnook-r2"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release_contract.outputs.track == 'beta' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android/newsnook-*-cloud-release.apk
            artifacts/android/newsnook-*-local*-release.apk
            artifacts/android/newsnook-*-cloud-release.aab
            artifacts/android/newsnook-*-local-release.aab

      - name: Prepare R2 manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLOUD_NAME="newsnook-${VERSION}-cloud-release.apk"
          LOCAL_NAME="newsnook-${VERSION}-local-release.apk"
          LOCAL_ARM64_NAME="newsnook-${VERSION}-local-arm64-v8a-release.apk"
          LOCAL_ARM32_NAME="newsnook-${VERSION}-local-armeabi-v7a-release.apk"
          LOCAL_X86_NAME="newsnook-${VERSION}-local-x86-release.apk"
          LOCAL_X64_NAME="newsnook-${VERSION}-local-x86_64-release.apk"
          CLOUD_APK="artifacts/android/${CLOUD_NAME}"
          LOCAL_APK="artifacts/android/${LOCAL_NAME}"
          LOCAL_ARM64_APK="artifacts/android/${LOCAL_ARM64_NAME}"
          LOCAL_ARM32_APK="artifacts/android/${LOCAL_ARM32_NAME}"
          LOCAL_X86_APK="artifacts/android/${LOCAL_X86_NAME}"
          LOCAL_X64_APK="artifacts/android/${LOCAL_X64_NAME}"
          PAYLOAD_DIR="${RUNNER_TEMP}/newsnook-r2"
          DELTA_INDEX_FILE="${PAYLOAD_DIR}/delta-index.json"
          test -f "$DELTA_INDEX_FILE"
          mkdir -p "$PAYLOAD_DIR"

          for file in "$CLOUD_APK" "$LOCAL_APK" "$LOCAL_ARM64_APK" "$LOCAL_ARM32_APK" "$LOCAL_X86_APK" "$LOCAL_X64_APK"; do
            test -f "$file"
          done

          RELEASE_JSON="${PAYLOAD_DIR}/github-release.json"
          NOTES_FILE="${PAYLOAD_DIR}/release-notes.md"
          MANIFEST_FILE="${PAYLOAD_DIR}/latest.json"
          LEGACY_MANIFEST_FILE="${PAYLOAD_DIR}/legacy-latest.json"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > "$RELEASE_JSON"
          jq -r '.body // ""' "$RELEASE_JSON" > "$NOTES_FILE"
          PUBLISHED_AT="$(jq -r '.published_at // empty' "$RELEASE_JSON")"
          if [ -z "$PUBLISHED_AT" ]; then
            PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          CLOUD_SHA256="$(sha256sum "$CLOUD_APK" | awk '{print $1}')"
          LOCAL_SHA256="$(sha256sum "$LOCAL_APK" | awk '{print $1}')"
          LOCAL_ARM64_SHA256="$(sha256sum "$LOCAL_ARM64_APK" | awk '{print $1}')"
          LOCAL_ARM32_SHA256="$(sha256sum "$LOCAL_ARM32_APK" | awk '{print $1}')"
          LOCAL_X86_SHA256="$(sha256sum "$LOCAL_X86_APK" | awk '{print $1}')"
          LOCAL_X64_SHA256="$(sha256sum "$LOCAL_X64_APK" | awk '{print $1}')"
          CLOUD_SIZE="$(stat -c%s "$CLOUD_APK")"
          LOCAL_SIZE="$(stat -c%s "$LOCAL_APK")"
          LOCAL_ARM64_SIZE="$(stat -c%s "$LOCAL_ARM64_APK")"
          LOCAL_ARM32_SIZE="$(stat -c%s "$LOCAL_ARM32_APK")"
          LOCAL_X86_SIZE="$(stat -c%s "$LOCAL_X86_APK")"
          LOCAL_X64_SIZE="$(stat -c%s "$LOCAL_X64_APK")"
          BASE_URL="${UPDATE_BASE_URL%/}"
          TRACK_URL="${BASE_URL}/newsnook/${RELEASE_TRACK}"

          jq -n             --slurpfile deltaIndex "$DELTA_INDEX_FILE"             --arg track "$RELEASE_TRACK"             --arg version "$VERSION"             --argjson versionCode "$VERSION_CODE"             --arg tagName "$GITHUB_REF_NAME"             --arg publishedAt "$PUBLISHED_AT"             --rawfile notes "$NOTES_FILE"             --arg cloudFileName "$CLOUD_NAME"             --arg cloudUrl "${TRACK_URL}/${CLOUD_NAME}"             --arg cloudSha256 "$CLOUD_SHA256"             --argjson cloudSize "$CLOUD_SIZE"             --arg localFileName "$LOCAL_NAME"             --arg localUrl "${TRACK_URL}/${LOCAL_NAME}"             --arg localSha256 "$LOCAL_SHA256"             --argjson localSize "$LOCAL_SIZE"             --arg arm64FileName "$LOCAL_ARM64_NAME"             --arg arm64Url "${TRACK_URL}/${LOCAL_ARM64_NAME}"             --arg arm64Sha256 "$LOCAL_ARM64_SHA256"             --argjson arm64Size "$LOCAL_ARM64_SIZE"             --arg arm32FileName "$LOCAL_ARM32_NAME"             --arg arm32Url "${TRACK_URL}/${LOCAL_ARM32_NAME}"             --arg arm32Sha256 "$LOCAL_ARM32_SHA256"             --argjson arm32Size "$LOCAL_ARM32_SIZE"             --arg x86FileName "$LOCAL_X86_NAME"             --arg x86Url "${TRACK_URL}/${LOCAL_X86_NAME}"             --arg x86Sha256 "$LOCAL_X86_SHA256"             --argjson x86Size "$LOCAL_X86_SIZE"             --arg x64FileName "$LOCAL_X64_NAME"             --arg x64Url "${TRACK_URL}/${LOCAL_X64_NAME}"             --arg x64Sha256 "$LOCAL_X64_SHA256"             --argjson x64Size "$LOCAL_X64_SIZE"             '{
              schemaVersion: 2,
              track: $track,
              version: $version,
              versionCode: $versionCode,
              tagName: $tagName,
              publishedAt: $publishedAt,
              notes: $notes,
              packages: {
                cloud: {
                  fileName: $cloudFileName,
                  url: $cloudUrl,
                  sha256: $cloudSha256,
                  size: $cloudSize,
                  deltas: $deltaIndex[0].cloud
                },
                local: {
                  fileName: $localFileName,
                  url: $localUrl,
                  sha256: $localSha256,
                  size: $localSize,
                  deltas: $deltaIndex[0].local,
                  abis: {
                    "arm64-v8a": { fileName: $arm64FileName, url: $arm64Url, sha256: $arm64Sha256, size: $arm64Size, deltas: $deltaIndex[0]["local-arm64-v8a"] },
                    "armeabi-v7a": { fileName: $arm32FileName, url: $arm32Url, sha256: $arm32Sha256, size: $arm32Size, deltas: $deltaIndex[0]["local-armeabi-v7a"] },
                    "x86": { fileName: $x86FileName, url: $x86Url, sha256: $x86Sha256, size: $x86Size, deltas: $deltaIndex[0]["local-x86"] },
                    "x86_64": { fileName: $x64FileName, url: $x64Url, sha256: $x64Sha256, size: $x64Size, deltas: $deltaIndex[0]["local-x86_64"] }
                  }
                }
              }
            }' > "$MANIFEST_FILE"

          jq -e --arg track "$RELEASE_TRACK" --arg version "$VERSION"             '.schemaVersion == 2 and .track == $track and .version == $version
              and (.packages.local.abis | keys | sort) == ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]'             "$MANIFEST_FILE" > /dev/null

          # 1.8.6 及更早客户端只理解根目录 schemaVersion=1。
          # 仅 stable 发布该兼容清单，beta 从不触碰旧客户端更新入口。
          if [ "$RELEASE_TRACK" = 'stable' ]; then
            jq -n               --arg version "$VERSION"               --arg tagName "$GITHUB_REF_NAME"               --arg publishedAt "$PUBLISHED_AT"               --rawfile notes "$NOTES_FILE"               --arg cloudFileName "$CLOUD_NAME"               --arg cloudUrl "${BASE_URL}/newsnook/${CLOUD_NAME}"               --arg cloudSha256 "$CLOUD_SHA256"               --argjson cloudSize "$CLOUD_SIZE"               --arg localFileName "$LOCAL_NAME"               --arg localUrl "${BASE_URL}/newsnook/${LOCAL_NAME}"               --arg localSha256 "$LOCAL_SHA256"               --argjson localSize "$LOCAL_SIZE"               '{
                schemaVersion: 1,
                version: $version,
                tagName: $tagName,
                publishedAt: $publishedAt,
                notes: $notes,
                channels: {
                  cloud: {
                    fileName: $cloudFileName,
                    url: $cloudUrl,
                    sha256: $cloudSha256,
                    size: $cloudSize
                  },
                  local: {
                    fileName: $localFileName,
                    url: $localUrl,
                    sha256: $localSha256,
                    size: $localSize
                  }
                }
              }' > "$LEGACY_MANIFEST_FILE"
          fi

          {
            echo "CLOUD_NAME=$CLOUD_NAME"
            echo "LOCAL_NAME=$LOCAL_NAME"
            echo "CLOUD_APK=$CLOUD_APK"
            echo "LOCAL_APK=$LOCAL_APK"
            echo "LOCAL_ARM64_NAME=$LOCAL_ARM64_NAME"
            echo "LOCAL_ARM32_NAME=$LOCAL_ARM32_NAME"
            echo "LOCAL_X86_NAME=$LOCAL_X86_NAME"
            echo "LOCAL_X64_NAME=$LOCAL_X64_NAME"
            echo "LOCAL_ARM64_APK=$LOCAL_ARM64_APK"
            echo "LOCAL_ARM32_APK=$LOCAL_ARM32_APK"
            echo "LOCAL_X86_APK=$LOCAL_X86_APK"
            echo "LOCAL_X64_APK=$LOCAL_X64_APK"
            echo "R2_DELTA_INDEX=$DELTA_INDEX_FILE"
            echo "R2_DELTA_DIR=$PAYLOAD_DIR/deltas"
            echo "R2_MANIFEST=$MANIFEST_FILE"
            echo "R2_LEGACY_MANIFEST=$LEGACY_MANIFEST_FILE"
          } >> "$GITHUB_ENV"

      - name: Upload release channel to R2
        run: |
          set -euo pipefail
          PREFIX="s3://${R2_BUCKET}/${R2_TRACK_PREFIX}"
          for spec in \
            "$CLOUD_APK:$CLOUD_NAME" \
            "$LOCAL_APK:$LOCAL_NAME" \
            "$LOCAL_ARM64_APK:$LOCAL_ARM64_NAME" \
            "$LOCAL_ARM32_APK:$LOCAL_ARM32_NAME" \
            "$LOCAL_X86_APK:$LOCAL_X86_NAME" \
            "$LOCAL_X64_APK:$LOCAL_X64_NAME"; do
            file="${spec%%:*}"
            name="${spec#*:}"
            aws s3 cp "$file" "${PREFIX}/${name}"               --endpoint-url "$R2_ENDPOINT"               --content-type 'application/vnd.android.package-archive'               --cache-control 'public,max-age=604800,immutable'               --no-progress
          done

          aws s3 cp "$CLOUD_APK" "${PREFIX}/latest-cloud.apk"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/vnd.android.package-archive'             --content-disposition "attachment; filename=\"${CLOUD_NAME}\""             --cache-control 'no-store,max-age=0'             --no-progress

          aws s3 cp "$LOCAL_APK" "${PREFIX}/latest-local.apk"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/vnd.android.package-archive'             --content-disposition "attachment; filename=\"${LOCAL_NAME}\""             --cache-control 'no-store,max-age=0'             --no-progress

          # 上传并核验差分对象后再发布 latest.json（客户端只读取最新清单）。
          while IFS= read -r name; do
            test -f "${R2_DELTA_DIR}/${name}"
            aws s3 cp "${R2_DELTA_DIR}/${name}" "${PREFIX}/deltas/${name}" \
              --endpoint-url "$R2_ENDPOINT" --content-type 'application/octet-stream' \
              --cache-control 'public,max-age=604800,immutable' --no-progress
          done < <(jq -r '[.[] | .[] | .fileName] | .[]' "$R2_DELTA_INDEX")

          # Publish the manifest only after every signed APK and referenced delta is reachable.
          for name in "$CLOUD_NAME" "$LOCAL_NAME" "$LOCAL_ARM64_NAME" "$LOCAL_ARM32_NAME" "$LOCAL_X86_NAME" "$LOCAL_X64_NAME"; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
              --head "${UPDATE_BASE_URL}/newsnook/${RELEASE_TRACK}/${name}" > /dev/null
          done
          while IFS= read -r name; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
              --head "${UPDATE_BASE_URL}/newsnook/${RELEASE_TRACK}/deltas/${name}" > /dev/null
          done < <(jq -r '[.[] | .[] | .fileName] | .[]' "$R2_DELTA_INDEX")

          aws s3 cp "$R2_MANIFEST" "${PREFIX}/latest.json"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/json; charset=utf-8'             --cache-control 'no-store,max-age=0'             --no-progress

      - name: Publish legacy stable compatibility endpoint
        if: steps.release_contract.outputs.track == 'stable'
        run: |
          set -euo pipefail
          ROOT="s3://${R2_BUCKET}/newsnook"

          aws s3 cp "$CLOUD_APK" "${ROOT}/${CLOUD_NAME}"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/vnd.android.package-archive'             --cache-control 'public,max-age=604800,immutable'             --no-progress
          aws s3 cp "$LOCAL_APK" "${ROOT}/${LOCAL_NAME}"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/vnd.android.package-archive'             --cache-control 'public,max-age=604800,immutable'             --no-progress
          aws s3 cp "$CLOUD_APK" "${ROOT}/latest-cloud.apk"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/vnd.android.package-archive'             --content-disposition "attachment; filename=\"${CLOUD_NAME}\""             --cache-control 'no-store,max-age=0'             --no-progress
          aws s3 cp "$R2_LEGACY_MANIFEST" "${ROOT}/latest.json"             --endpoint-url "$R2_ENDPOINT"             --content-type 'application/json; charset=utf-8'             --cache-control 'no-store,max-age=0'             --no-progress

      - name: Verify published release channel
        run: |
          set -euo pipefail
          BASE="${UPDATE_BASE_URL}/newsnook/${RELEASE_TRACK}"
          for name in "$CLOUD_NAME" "$LOCAL_NAME" "$LOCAL_ARM64_NAME" "$LOCAL_ARM32_NAME" "$LOCAL_X86_NAME" "$LOCAL_X64_NAME" 'latest-cloud.apk' 'latest-local.apk'; do
            curl --fail --silent --show-error --location               --retry 5 --retry-delay 3 --head "${BASE}/${name}" > /dev/null
          done

          while IFS= read -r name; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --head "${BASE}/deltas/${name}" > /dev/null
          done < <(jq -r '[.[] | .[] | .fileName] | .[]' "$R2_DELTA_INDEX")

          PUBLISHED="${RUNNER_TEMP}/published-latest.json"
          curl --fail --silent --show-error --location             --retry 5 --retry-delay 3             "${BASE}/latest.json?t=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$PUBLISHED"

          jq -e             --arg track "$RELEASE_TRACK"             --arg version "$VERSION"             --arg cloud "$CLOUD_NAME"             --arg local "$LOCAL_NAME"             '.schemaVersion == 2
              and .track == $track
              and .version == $version
              and .packages.cloud.fileName == $cloud
              and .packages.local.fileName == $local
              and (.packages.local.abis | keys | sort) == ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]'             "$PUBLISHED" > /dev/null
          jq -e --slurpfile index "$R2_DELTA_INDEX" \
            '.packages.cloud.deltas == $index[0].cloud
              and .packages.local.deltas == $index[0].local
              and .packages.local.abis["arm64-v8a"].deltas == $index[0]["local-arm64-v8a"]
              and .packages.local.abis["armeabi-v7a"].deltas == $index[0]["local-armeabi-v7a"]
              and .packages.local.abis.x86.deltas == $index[0]["local-x86"]
              and .packages.local.abis.x86_64.deltas == $index[0]["local-x86_64"]' \
            "$PUBLISHED" > /dev/null

      - name: Verify legacy stable endpoint
        if: steps.release_contract.outputs.track == 'stable'
        run: |
          set -euo pipefail
          PUBLISHED="${RUNNER_TEMP}/published-legacy-latest.json"
          curl --fail --silent --show-error --location             --retry 5 --retry-delay 3             "${UPDATE_BASE_URL}/newsnook/latest.json?t=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             > "$PUBLISHED"
          jq -e --arg version "$VERSION"             '.schemaVersion == 1 and .version == $version' "$PUBLISHED" > /dev/null
          curl --fail --silent --show-error --location --head             "${UPDATE_BASE_URL}/newsnook/latest-cloud.apk" > /dev/null

      - name: Remove previous objects from this release channel
        run: |
          set -euo pipefail
          OBJECTS="${RUNNER_TEMP}/r2-track-objects.json"
          PREFIX="${R2_TRACK_PREFIX}/"
          aws s3api list-objects-v2             --bucket "$R2_BUCKET"             --prefix "$PREFIX"             --endpoint-url "$R2_ENDPOINT"             --output json > "$OBJECTS"

          while IFS= read -r key; do
            case "$key" in
              "${PREFIX}latest.json"|"${PREFIX}latest-cloud.apk"|"${PREFIX}latest-local.apk"|"${PREFIX}${CLOUD_NAME}"|"${PREFIX}${LOCAL_NAME}"|"${PREFIX}${LOCAL_ARM64_NAME}"|"${PREFIX}${LOCAL_ARM32_NAME}"|"${PREFIX}${LOCAL_X86_NAME}"|"${PREFIX}${LOCAL_X64_NAME}")
                ;;
              "${PREFIX}deltas/"*)
                name="${key##*/}"
                if ! jq -e --arg name "$name" 'any(.[][]; .fileName == $name)' "$R2_DELTA_INDEX" > /dev/null; then
                  echo "Deleting obsolete delta: $key"
                  aws s3api delete-object --bucket "$R2_BUCKET" --key "$key" \
                    --endpoint-url "$R2_ENDPOINT" > /dev/null
                fi
                ;;
              *)
                echo "Deleting old ${RELEASE_TRACK} object: $key"
                aws s3api delete-object                   --bucket "$R2_BUCKET"                   --key "$key"                   --endpoint-url "$R2_ENDPOINT" > /dev/null
                ;;
            esac
          done < <(jq -r '.Contents[]?.Key' "$OBJECTS")

      - name: Remove previous legacy stable root objects
        if: steps.release_contract.outputs.track == 'stable'
        run: |
          set -euo pipefail
          OBJECTS="${RUNNER_TEMP}/r2-root-objects.json"
          aws s3api list-objects-v2             --bucket "$R2_BUCKET"             --prefix 'newsnook/'             --endpoint-url "$R2_ENDPOINT"             --output json > "$OBJECTS"

          while IFS= read -r key; do
            # 只处理根目录对象；stable/ 与 beta/ 子目录绝不参与兼容清理。
            if ! printf '%s' "$key" | grep -Eq '^newsnook/[^/]+$'; then
              continue
            fi
            case "$key" in
              'newsnook/latest.json'|'newsnook/latest-cloud.apk'|"newsnook/${CLOUD_NAME}"|"newsnook/${LOCAL_NAME}")
                ;;
              *)
                echo "Deleting old legacy stable object: $key"
                aws s3api delete-object                   --bucket "$R2_BUCKET"                   --key "$key"                   --endpoint-url "$R2_ENDPOINT" > /dev/null
                ;;
            esac
          done < <(jq -r '.Contents[]?.Key' "$OBJECTS")

      - name: Verify channel isolation
        run: |
          set -euo pipefail
          FINAL="${RUNNER_TEMP}/r2-track-final.json"
          PREFIX="${R2_TRACK_PREFIX}/"
          aws s3api list-objects-v2             --bucket "$R2_BUCKET"             --prefix "$PREFIX"             --endpoint-url "$R2_ENDPOINT"             --output json > "$FINAL"

          COUNT="$(jq '[.Contents[]?] | length' "$FINAL")"
          DELTA_COUNT="$(jq '[.[] | .[]] | length' "$R2_DELTA_INDEX")"
          EXPECTED_COUNT=$((9 + DELTA_COUNT))
          if [ "$COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::Expected ${EXPECTED_COUNT} objects under ${PREFIX}, got ${COUNT}."
            jq -r '.Contents[]?.Key' "$FINAL"
            exit 1
          fi

          jq -e \
            --arg manifest "${PREFIX}latest.json" \
            --arg latestCloud "${PREFIX}latest-cloud.apk" \
            --arg latestLocal "${PREFIX}latest-local.apk" \
            --arg cloud "${PREFIX}${CLOUD_NAME}" \
            --arg local "${PREFIX}${LOCAL_NAME}" \
            --arg arm64 "${PREFIX}${LOCAL_ARM64_NAME}" \
            --arg arm32 "${PREFIX}${LOCAL_ARM32_NAME}" \
            --arg x86 "${PREFIX}${LOCAL_X86_NAME}" \
            --arg x64 "${PREFIX}${LOCAL_X64_NAME}" \
            --arg deltaPrefix "${PREFIX}deltas/" \
            --slurpfile index "$R2_DELTA_INDEX" \
            '[.Contents[]?.Key] | sort == ([$manifest, $latestCloud, $latestLocal, $cloud, $local, $arm64, $arm32, $x86, $x64] + [$index[0][][] | $deltaPrefix + .fileName] | sort)' \
            "$FINAL" > /dev/null
