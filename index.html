<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 启动阶段固定深色；主题色等启动页交还后再改，避免状态栏区域闪米白 -->
    <meta name="theme-color" content="#0E0F12" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="有所闻 News Nook，直连原发媒体的沉浸式阅读器。" />
    <!--
      首页的默认社交卡片。仅当抓取站点根等普通页面时生效；
      /a/* 分享深链要么在边缘 worker 就被接走、要么由 worker 按 token 把这几行
      改写成文章级标签（functions/lib/shareCard.ts），抓取端永远不会落到这份站点壳 meta 上。
      改这些标签的属性写法前先看 shareCard.ts 里的 SHELL_META_PATTERN，别让改写漏匹配。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="有所闻" />
    <meta property="og:title" content="有所闻 · News Nook" />
    <meta property="og:description" content="有所闻 News Nook，直连原发媒体的沉浸式阅读器。" />
    <meta property="og:url" content="https://news.aizeek.com/" />
    <meta property="og:image" content="https://news.aizeek.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        /* fallback for Chrome < 79 where max() is unsupported */
        --sat: var(--sat-native, env(safe-area-inset-top, 0px));
        --sab: var(--sab-native, env(safe-area-inset-bottom, 0px));
        --sal: var(--sal-native, env(safe-area-inset-left, 0px));
        --sar: var(--sar-native, env(safe-area-inset-right, 0px));
      }
      @supports (width: max(1px, 2px)) {
        :root {
          --sat: max(var(--sat-native, 0px), env(safe-area-inset-top, 0px));
          --sab: max(var(--sab-native, 0px), env(safe-area-inset-bottom, 0px));
          --sal: max(var(--sal-native, 0px), env(safe-area-inset-left, 0px));
          --sar: max(var(--sar-native, 0px), env(safe-area-inset-right, 0px));
        }
      }

      /*
       * #boot-splash 只是 WebView 首帧的深色壳，防止系统开屏撤走后露白。
       * 静态/完整启动画面仍由 React StartupSplash 绘制，这里不画假竖线。
       */
      html,
      body {
        margin: 0;
        background: #0e0f12;
      }

      html[data-boot='splash'],
      html[data-boot='splash'] body {
        background: #0e0f12;
      }

      #boot-splash {
        position: fixed;
        z-index: 2147483646;
        inset: 0;
        background: #0e0f12;
        pointer-events: none;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <!--
      远端字体表会阻塞渲染，并连带推迟入口模块执行；
      弱网或离线时这段等待只会拉长空屏。先按 print 拉取，到手再切回 all。
      字体走 Google 中国节点（fonts.googleapis.cn / gstatic.cn），2026-03 实测可用。
    -->
    <link
      href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>有所闻 · News Nook</title>
    <script>
      // WebView 版本检测：低于 Chrome 69 直接提示，不进入应用
      ;(function () {
        var ua = navigator.userAgent
        var match = ua.match(/Chrome\/(\d+)/)
        var ver = match ? parseInt(match[1], 10) : 999
        if (ver < 69) {
          document.title = '需要更新 WebView'
          document.documentElement.innerHTML =
            '<body style="margin:0;background:#0e0f12;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center">' +
            '<div><h2 style="font-size:20px;margin:0 0 12px">需要更新系统 WebView</h2>' +
            '<p style="font-size:14px;opacity:.7;line-height:1.6">您的 Android System WebView 版本过低（Chrome ' + ver + '），无法运行本应用。<br>请在应用商店搜索「Android System WebView」或「Google Chrome」并更新。</p></div></body>'
          throw new Error('WebView too old: Chrome/' + ver)
        }
      })()

      // Chrome < 84 不支持 flex gap，标记 html 以启用 CSS margin fallback
      ;(function () {
        var ua = navigator.userAgent
        var m = ua.match(/Chrome\/(\d+)/)
        if (m && parseInt(m[1], 10) < 84) {
          document.documentElement.dataset.noFlexGap = '1'
        }
      })()

      // 低版本 Android WebView 兼容 Polyfill
      ;(function () {
        // globalThis（Chrome 71+）
        if (typeof globalThis === 'undefined') {
          ;(function () { this.globalThis = this })()
        }
        if (typeof Object.hasOwn !== 'function') {
          Object.hasOwn = function (obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop)
          }
        }
        if (!Array.prototype.at) {
          Array.prototype.at = function (n) {
            n = Math.trunc(n) || 0
            if (n < 0) n += this.length
            if (n < 0 || n >= this.length) return undefined
            return this[n]
          }
        }
        if (!String.prototype.at) {
          String.prototype.at = function (n) {
            n = Math.trunc(n) || 0
            if (n < 0) n += this.length
            if (n < 0 || n >= this.length) return ''
            return this.charAt(n)
          }
        }
        if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
          crypto.randomUUID = function () {
            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
              return (
                Number(c) ^
                (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (Number(c) / 4)))
              ).toString(16)
            })
          }
        }
        if (typeof globalThis.structuredClone !== 'function') {
          globalThis.structuredClone = function (val) {
            return JSON.parse(JSON.stringify(val))
          }
        }
        if (typeof queueMicrotask !== 'function') {
          window.queueMicrotask = function (cb) {
            Promise.resolve().then(cb)
          }
        }
        // String.prototype.replaceAll（Chrome 85+）
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function (search, replacement) {
            if (search instanceof RegExp) {
              if (!search.global) throw new TypeError('replaceAll must be called with a global RegExp')
              return this.replace(search, replacement)
            }
            return this.split(search).join(replacement)
          }
        }
        // Array.prototype.findLast / findLastIndex（Chrome 97+）
        if (!Array.prototype.findLast) {
          Array.prototype.findLast = function (fn, thisArg) {
            for (var i = this.length - 1; i >= 0; i--) {
              if (fn.call(thisArg, this[i], i, this)) return this[i]
            }
          }
        }
        if (!Array.prototype.findLastIndex) {
          Array.prototype.findLastIndex = function (fn, thisArg) {
            for (var i = this.length - 1; i >= 0; i--) {
              if (fn.call(thisArg, this[i], i, this)) return i
            }
            return -1
          }
        }
        // Promise.allSettled（Chrome 76+）
        if (!Promise.allSettled) {
          Promise.allSettled = function (promises) {
            return Promise.all(
              Array.from(promises).map(function (p) {
                return Promise.resolve(p).then(
                  function (value) { return { status: 'fulfilled', value: value } },
                  function (reason) { return { status: 'rejected', reason: reason } }
                )
              })
            )
          }
        }
        // Object.groupBy（Chrome 117+）
        if (typeof Object.groupBy !== 'function') {
          Object.groupBy = function (items, callbackFn) {
            var obj = Object.create(null)
            var i = 0
            for (var item of items) {
              var key = callbackFn(item, i++)
              if (!(key in obj)) obj[key] = []
              obj[key].push(item)
            }
            return obj
          }
        }
      })()

      // 在样式表生效前定好明暗与风格方案。启动阶段不改 theme-color，避免状态栏闪米白。
      // 数据源是 localStorage 镜像，真实偏好稍后由 main.tsx 再校准一次。
      ;(function () {
        document.documentElement.dataset.boot = 'splash'

        try {
          var saved = JSON.parse(localStorage.getItem('newsnook:preferences') || '{}')
          var mode = saved && saved.theme
          var resolved =
            mode === 'light' || mode === 'dark'
              ? mode
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
          // 方案白名单与 src/lib/theme.ts 的 ThemeScheme 保持一致，非法值兜底墨问
          var scheme = saved && saved.scheme
          document.documentElement.dataset.scheme =
            scheme === 'celadon' || scheme === 'pearl' || scheme === 'custom' ? scheme : 'ink'
          if (saved && saved.einkMode === true) {
            document.documentElement.dataset.eink = '1'
          } else {
            delete document.documentElement.dataset.eink
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.scheme = 'ink'
          delete document.documentElement.dataset.eink
        }
      })()
    </script>
  </head>
  <body>
    <!-- 纯深色壳；竖排与文案由 StartupSplash 负责 -->
    <div id="boot-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
