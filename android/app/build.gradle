apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv("NEWSNOOK_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("NEWSNOOK_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NEWSNOOK_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NEWSNOOK_KEY_PASSWORD")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (isReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is not configured. Run `npm run android:keystore:init` or provide NEWSNOOK_KEYSTORE_* environment variables."
    )
}

// 唯一版本源：package.json。支持正式版 X.Y.Z 与内测版 X.Y.Z-beta.N。
// versionCode 规则必须与 src/features/appUpdate/semver.ts 保持一致：
//   beta.N = core*1000 + N；stable = core*1000 + 999。
// 因此 beta.1 -> beta.N -> stable -> 下一 core beta 始终是 Android 可覆盖安装的升级。
def packageJsonFile = file("../../package.json")
if (!packageJsonFile.exists()) {
    throw new GradleException("package.json not found at ${packageJsonFile.canonicalPath}")
}
def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.getText('UTF-8'))
def packageVersion = (packageJson.version ?: '').toString().trim()
def versionMatch = packageVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/
if (!versionMatch.matches()) {
    throw new GradleException("package.json version must be X.Y.Z or X.Y.Z-beta.N, got: ${packageVersion}")
}
def major = versionMatch[0][1] as int
def minor = versionMatch[0][2] as int
def patch = versionMatch[0][3] as int
def betaNumber = versionMatch[0][4] ? (versionMatch[0][4] as int) : null
if (minor > 99 || patch > 99 || (betaNumber != null && (betaNumber < 1 || betaNumber > 998))) {
    throw new GradleException("Version components out of supported range: ${packageVersion}")
}
def versionCore = major * 10000 + minor * 100 + patch
def derivedVersionCode = versionCore * 1000 + (betaNumber != null ? betaNumber : 999)
if (derivedVersionCode <= 0 || derivedVersionCode > 2100000000) {
    throw new GradleException("Derived Android versionCode out of range: ${derivedVersionCode}")
}
// 仅当 Play/商店迁移确有需要时允许显式覆盖；正常发布不得使用覆盖值。
def appVersionCode = Integer.parseInt(System.getenv("NEWSNOOK_VERSION_CODE") ?: "${derivedVersionCode}")
def appVersionName = System.getenv("NEWSNOOK_VERSION_NAME") ?: packageVersion
// APK 自托管分发时按 ABI 拆 local 包；仅由 scripts/android-build.mjs 显式开启。
// AAB / Android Studio / debug 默认关闭，避免影响 Play split 与日常开发。
def enableLocalAbiSplits = providers.gradleProperty("newsnookLocalAbiSplits")
    .map { it.toBoolean() }
    .getOrElse(false)

android {
    namespace = "com.aizeek.newsnook"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions += "translation"
    productFlavors {
        // 不链接 ML Kit / Bergamot：适合默认分发，保留云翻译。
        cloud {
            dimension "translation"
            externalNativeBuild {
                cmake {
                    arguments "-DENABLE_BERGAMOT=OFF"
                }
            }
        }
        // 链接 ML Kit + Bergamot/Marian：提供模型下载和完全离线翻译。
        local {
            dimension "translation"
            // Bergamot/Marian 依赖 bionic iconv 与 glob（API 28+）
            minSdkVersion 28
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a"
                    arguments "-DANDROID_STL=c++_shared", "-DENABLE_BERGAMOT=ON"
                }
            }
        }
    }
    defaultConfig {
        applicationId "com.aizeek.newsnook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/local/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
    splits {
        abi {
            enable enableLocalAbiSplits
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// cloud flavor 不需要原生引擎；禁用其 CMake/Ninja 任务以免空跑。
afterEvaluate {
    tasks.matching { task ->
        def name = task.name.toLowerCase()
        (name.contains("externalnativebuild") || name.contains("cmake")) && name.contains("cloud")
    }.configureEach { task ->
        task.enabled = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-android')
    localImplementation 'com.google.mlkit:translate:17.0.3'
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
